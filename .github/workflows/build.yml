name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Localizar projeto (pasta normal ou .zip enviado)
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            Z=$(ls *.zip | head -n1)
            mkdir -p _proj
            unzip -q -o "$Z" -d _proj
            S=$(find _proj -name settings.gradle.kts | head -n1)
            echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        run: cd "$PROJ" && gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MangaTradutor-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
